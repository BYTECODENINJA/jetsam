[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "GPL-3.0-or-later"
repository = "https://github.com/jetsam-dev/jetsam"
authors = ["Jetsam contributors"]
description = "A usage-aware package companion for Arch Linux"

[workspace.dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
alpm = "5.0.2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
